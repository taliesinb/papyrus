<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Before the first paint, so a narrow window never flashes cover thumbnails (+layout.svelte keeps it current). -->
		<script>document.documentElement.classList.toggle('narrow', innerWidth < (screen.width * 2) / 3);</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
